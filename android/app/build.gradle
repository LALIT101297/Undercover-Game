plugins { id 'com.android.application' }

def stableKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'com.undercoverimposter.app'
    compileSdk 35

    signingConfigs {
        if (stableKeystorePath) {
            stableDebug {
                storeFile file(stableKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.undercoverimposter.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        debug {
            if (stableKeystorePath) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }
}

dependencies {
    implementation 'com.inmobi.monetization:inmobi-ads-kotlin:11.5.0'
}
